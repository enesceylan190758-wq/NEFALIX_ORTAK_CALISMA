<script type="text/x-dc" data-dc-script="">
const PAGES = ['Login','Dashboard','KurumKarti','KurumListesi','YeniKurum','YeniLead','LeadListesi','DinamikArama','DinamikAramaHavuz','Salesline','SonYapilanIslemler','YeniRandevu','RandevuTakvim','RandevuListe','YeniSatis','Kasa','SatisListesi','BakiyeListesi','BankaOzet','GelirlerListe','GiderKaydet','Giderler','Raporlar','YeniTeklif','Teklifler','NotlarGorevler','Faturalar','FirmaListesi','WhatsappPanel','Yetki','Ayarlar','Personel','Hizmet','Paket','Urun','Destek'];
class Component extends DCLogic {
  state = { route: '', booted: false };
  componentDidMount() {
    this._onHash = () => this._sync();
    window.addEventListener('hashchange', this._onHash);
    const boot = () => this._sync();
    if (window.Nefalix && window.Nefalix.ready) window.Nefalix.ready().then(boot); else boot();
  }
  componentWillUnmount() { if (this._onHash) window.removeEventListener('hashchange', this._onHash); }
  _sync() {
    const N = window.Nefalix;
    const authed = !!(N && N.currentUser && N.currentUser());
    let page = (N && N.currentPage) ? N.currentPage('') : '';
    if (!page || PAGES.indexOf(page) < 0) page = authed ? 'Dashboard' : 'Login';
    if (!authed && page !== 'Login') { location.hash = '#Login'; return; }
    if (authed && page === 'Login') { location.hash = '#Dashboard'; return; }
    this.setState({ route: page, booted: true });
  }
  renderVals() {
    const N = window.Nefalix;
    const page = this.state.route;
    const vals = { booting: !this.state.booted, hkKey: (N && N.param && N.param('id')) || 'none' };
    PAGES.forEach(p => { vals['p_' + p] = (this.state.booted && page === p); });
    return vals;
  }
}
</script>
